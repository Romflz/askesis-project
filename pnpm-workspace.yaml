packages:
  - apps/*
  - packages/*
  - tools/*

# Dependencies allowed to run install scripts (pnpm blocks them by default).
# esbuild's script sets up its platform-specific binary. sass's file watcher
# ships prebuilt binaries, so its fallback build script stays off.
allowBuilds:
  esbuild: true
  '@parcel/watcher': false

minimumReleaseAgeExclude:
  - argparse@3.0.3
  - markdown-it@15.0.3
